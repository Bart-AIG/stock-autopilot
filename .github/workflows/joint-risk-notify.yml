# Delivers the Joint risk watch report to Ryan's phone. Same pattern as
# eod-report-notify.yml: Claude cloud sessions cannot reach ntfy.sh, so the routine
# commits joint_risk_report.md to master and this runner sends it.
name: Joint risk watch notify

on:
  push:
    branches: [master]
    paths: [joint_risk_report.md]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write    # fallback: open an issue if the ntfy push fails

concurrency:
  group: joint-risk-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Send report
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Risk pushes outrank the Stock Autopilot report pushes (Ryan, 2026-10-05):
          # RED / ORANGE / CRACK WATCH = urgent, everything else = high.
          FIRST="$(head -n1 joint_risk_report.md | sed 's/^#* *//')"
          [ -n "$FIRST" ] || FIRST='RISK update'
          TIER="$(echo "$FIRST" | awk '$1=="RISK"{print $2}')"
          PRIO=high
          case "$TIER" in RED|ORANGE) PRIO=urgent ;; esac
          case "$FIRST" in *"CRACK WATCH"*) PRIO=urgent ;; esac
          python3 .github/scripts/ntfy_send.py --title "Joint $FIRST" --priority "$PRIO" \
            --tags rotating_light --file joint_risk_report.md --fallback-issue \
            --click https://github.com/Bart-AIG/stock-autopilot/blob/master/joint_risk_report.md
