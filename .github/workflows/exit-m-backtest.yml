name: Exit backtest part 2

# Runs exit_m_backtest.py on GitHub's runners (the only place with the FMP key) and
# commits exit_m_results.md back to the branch that triggered it. Read-only
# analysis: it never touches the ledger, the reports or any account.
#
# Fires on a push to a claude/* branch that changes backtest.py or this file,
# or from the Actions tab (workflow_dispatch, once this file is on master).

on:
  push:
    branches: ['claude/**', '!claude/joint-risk-watch**', '!claude/quality-watch**']  # advisory routines never trigger research jobs
    paths: ['exit_m_backtest.py', '.github/workflows/exit-m-backtest.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exit-m-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run backtest
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python exit_m_backtest.py
      - name: Upload data + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-m-backtest
          path: |
            exit_m_results.md
          if-no-files-found: warn
      - name: Commit results to the branch
        run: |
          git config user.name 'stock-autopilot-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exit_m_results.md
          git commit -m "exit-m: results $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
