# Delivers the Quality @ 200-day report to Ryan's phone. Same pattern as
# eod-report-notify.yml: Claude cloud sessions cannot reach ntfy.sh, so the routine
# commits quality_watch_report.md to master and this runner sends it.
name: Quality watch notify

on:
  push:
    branches: [master]
    paths: [quality_watch_report.md]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write    # fallback: open an issue if the ntfy push fails

concurrency:
  group: quality-watch-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Send report
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Quality @ 200-day pushes outrank the Stock Autopilot report pushes
          # (Ryan, 2026-10-05), so they go out at high.
          FIRST="$(head -n1 quality_watch_report.md | sed 's/^#* *//')"
          [ -n "$FIRST" ] || FIRST='Quality @ 200-day update'
          python3 .github/scripts/ntfy_send.py --title "$FIRST" --priority high \
            --tags chart_with_upwards_trend --file quality_watch_report.md --fallback-issue \
            --click https://github.com/Bart-AIG/stock-autopilot/blob/master/quality_watch_report.md
